- id: nvidia
  order: 1
  title: Senior Research Scientist
  company: NVIDIA
  companyUrl: https://research.nvidia.com/
  location: Salt Lake City, Utah
  dateStart: "2021-02-01"
  description: |-
    I work on AI system architecture at NVIDIA Research, using analytical models to explore software and hardware tradeoffs for large language models (LLMs). I developed Calculon, a framework for rapidly estimating performance and resource usage across a broad range of execution configurations, and built tools for large-scale LLM training analysis, including studies of models with up to 128 trillion parameters. This work was published at SC23 and helped identify more efficient LLM optimization and system design strategies. My research also examines scale-up and scale-out interconnects and network topologies, including approaches that use optical circuit switches for efficient large-scale training. I have contributed to distributed GEMM research and software infrastructure by defining reusable multi-GPU APIs and helping integrate distributed algorithms into CUTLASS. I also develop AI accelerator design concepts that minimize energy use and data movement while maximizing inference speed across emerging model workloads.

- id: google
  order: 2
  title: Senior Software Engineer
  company: Google
  companyUrl: https://research.google/research-areas/networking/
  location: Sunnyvale, California
  dateStart: "2019-01-01"
  dateEnd: "2021-01-29"
  description: |-
    At Google, I developed next-generation data center network topologies, routing algorithms, transport protocols, congestion control systems, and switching architectures. This work included guiding the architecture of future accelerated networking hardware and software systems. I also developed ParaGraph, an application-simulator interface and toolkit for hardware/software co-design that connected compiler-derived workload models with simulation infrastructure to support large-scale system exploration. ParaGraph was published at ICPP 2022.

- id: hpe
  order: 3
  title: Research Scientist
  company: Hewlett Packard Labs
  companyUrl: https://www.hpe.com/us/en/hewlett-packard-labs.html
  location: Fort Collins, Colorado
  dateStart: "2016-01-01"
  dateEnd: "2018-12-31"
  description: |-
    At Hewlett Packard Labs, I was a lead architect for a new high-performance network supporting large-scale high-performance computing (HPC) and massively parallel memory-driven computing (MDC) systems. I was a key designer of the Gen-Z routing architecture specification. Using data-driven simulation, I also guided the design of a novel multi-chip module (MCM) switch architecture that used co-packaged integrated photonics.

- id: l3
